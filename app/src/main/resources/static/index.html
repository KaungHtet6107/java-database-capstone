<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Role</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Common JavaScript -->
    <script src="/js/util.js" defer></script>
    <script src="/js/render.js" defer></script>

    <!-- Components -->
    <script src="/js/components/header.js" defer></script>
    <script src="/js/components/footer.js" defer></script>

</head>

<body>

<div class="container">

    <div class="wrapper">

        <!-- Header -->
        <div id="header"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="role-selection">

                <h2 id="roleHeading">
                    Select Your Role
                </h2>

                <p class="description">
                    Welcome to the Smart Clinic Management System.
                    Please choose your role below.
                </p>

                <div class="button-group">

                    <button
                            id="adminBtn"
                            class="role-btn">
                        Admin
                    </button>

                    <button
                            id="doctorBtn"
                            class="role-btn">
                        Doctor
                    </button>

                    <button
                            id="patientBtn"
                            class="role-btn">
                        Patient
                    </button>

                </div>

            </div>

        </main>

        <!-- Footer -->
        <div id="footer"></div>

    </div>

</div>

<!-- Login Modal -->

<div id="modal" class="modal">

    <div class="modal-content">

        <span id="closeModal" class="close">&times;</span>

        <div id="modal-body">

            <!-- Dynamic login form will be rendered here -->

        </div>

    </div>

</div>

<!-- Page Script -->
<script type="module" src="/js/services/authService.js"></script>
<script type="module" src="/js/services/index.js"></script>
</body>

</html>
