<!-- adminDashboard.html -->

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/png"
          th:href="@{/assets/images/logo/logo.png}" />

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/assets/css/adminDashboard.css}" />

    <link rel="stylesheet"
          th:href="@{/assets/css/style.css}" />

    <!-- Common JavaScript -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- Components -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

</head>

<body onload="renderContent()">

<div class="container">

    <div class="wrapper">

        <!-- Header -->
        <div id="header"></div>

        <!-- Main Content -->
        <main class="main-content">

            <section class="dashboard">

                <h2 class="dashboard-title">
                    Admin Dashboard
                </h2>

                <!-- Search -->

                <div class="search-section">

                    <input
                            type="text"
                            id="searchBar"
                            placeholder="Search by doctor name..." />

                </div>

                <!-- Filters -->

                <div class="filter-section">

                    <select id="timeFilter">

                        <option value="">All Times</option>

                        <option value="AM">AM</option>

                        <option value="PM">PM</option>

                    </select>

                    <select id="specialtyFilter">

                        <option value="">All Specialties</option>

                        <option value="Cardiologist">Cardiologist</option>

                        <option value="Dentist">Dentist</option>

                        <option value="Dermatologist">Dermatologist</option>

                        <option value="Neurologist">Neurologist</option>

                        <option value="Orthopedic">Orthopedic</option>

                        <option value="Pediatrician">Pediatrician</option>

                    </select>

                </div>

                <!-- Doctor Cards -->

                <div id="content" class="doctor-container">

                    <!-- Doctor cards will be rendered dynamically -->

                </div>

            </section>

        </main>

        <!-- Footer -->

        <div id="footer"></div>

    </div>

</div>

<!-- Modal -->

<div id="modal" class="modal">

    <div class="modal-content">

        <span
                id="closeModal"
                class="close">
            &times;
        </span>

        <div id="modal-body">

            <!-- Add Doctor Form will appear here -->

        </div>

    </div>

</div>

<!-- Page JavaScript -->

<script type="module"
        th:src="@{/js/adminDashboard.js}">
</script>

<script type="module"
        th:src="@{/js/components/doctorCard.js}">
</script>

</body>

</html>
