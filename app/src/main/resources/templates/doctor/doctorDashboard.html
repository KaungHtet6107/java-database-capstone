<!-- doctorDashboard.html -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <link rel="icon"
          type="image/png"
          th:href="@{/assets/images/logo/logo.png}">

    <title>Doctor Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- Common JavaScript -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

    <!-- Doctor Dashboard Script -->
    <script type="module"
            th:src="@{/js/doctorDashboard.js}"
            defer></script>
</head>

<body onload="renderContent()">

<div class="container">

    <div class="wrapper">

        <!-- Dynamic Header -->
        <div id="header"></div>

        <main class="main-content">

            <h2>Doctor Dashboard</h2>

            <!-- Search -->
            <div class="search-container">
                <input
                        type="text"
                        id="searchBar"
                        class="searchBar"
                        placeholder="Search patient..."
                >
            </div>

            <!-- Filters -->
            <div class="filter-container">

                <button
                        id="todayButton"
                        class="today-btn">
                    Today's Appointments
                </button>

                <input
                        type="date"
                        id="datePicker"
                        class="date-picker"
                >

            </div>

            <!-- Patient Table -->
            <div class="table-container">

                <table>

                    <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Phone No.</th>
                        <th>Email</th>
                        <th>Prescription</th>
                    </tr>
                    </thead>

                    <tbody id="patientTableBody">
                    <!-- JavaScript will insert rows here -->
                    </tbody>

                </table>

            </div>

        </main>

        <!-- Dynamic Footer -->
        <div id="footer"></div>

    </div>

</div>

</body>

</html>
